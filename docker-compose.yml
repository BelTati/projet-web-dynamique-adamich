
services:
  webdev_laravel:
    image: webdev_projet_web
    container_name: webdev_laravel
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./webdev_projet_laravel:/var/www/webdev_projet_laravel
    depends_on:
      - db
    networks:
      - webdev-laravel-net

  db:
    image: mariadb:latest
    container_name: database
    restart: always
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: webdev-laravel
      MYSQL_DATABASE: prj_web
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - ./.data:/var/lib/mysql
    networks:
      - webdev-laravel-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-gui
    restart: always
    ports:
      - "8080:80"  # Accès via http://localhost:8080
    environment:
      - PMA_HOST=db  # <--- Indique à phpMyAdmin de se connecter au service "db"
      - PMA_PORT=3306
      - ARBITRARY_SERVER=1 # Optionnel : permet de se connecter à n'importe quel serveur
    networks:
      - webdev-laravel-net # DOIT être le même réseau que votre service "db"
    depends_on:
      - db
volumes:
    data:

networks:
  webdev-laravel-net:
    driver: bridge

